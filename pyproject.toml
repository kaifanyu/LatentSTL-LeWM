[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-stl-lewm"
version = "0.1.0"
description = "Signal Temporal Logic over images and LeWorldModel latents in LIBERO"
readme = "README.md"
requires-python = ">=3.11,<3.12"

[project.urls]
Repository = "https://github.com/kaifanyu/LatentSTL-LeWM"

[tool.setuptools.packages.find]
include = ["latent_stl_lewm*"]

[tool.setuptools.package-data]
latent_stl_lewm = ["assets/*.bddl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
