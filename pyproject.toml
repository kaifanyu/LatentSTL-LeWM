[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-stl-lewm"
version = "0.1.0"
description = "Isolated LIBERO LeWorldModel latent STL experiments"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
include = ["latent_stl_lewm*"]

[tool.setuptools.package-data]
latent_stl_lewm = ["assets/*.bddl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
